name: Build v2.0.4-beta MSI

on:
  push:
    branches: [main]
    paths:
      - 'mozc/overlay/src/renderer/**'
      - 'mozc/overlay/src/rewriter/**'
      - 'ranker/**'
      - 'product_settings.py'
      - 'requirements-runtime.txt'
      - 'tests/test_rerank_safety.py'
      - 'scripts/modernize_mozc_ui.py'
      - 'scripts/prepare_mozc_source.ps1'
      - '.github/workflows/build-modern-ui-msi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@77a1d3d18379c7cb0a7e3b9fcaaa4d94f1029763 # 0.18.0
        with:
          bazelisk-cache: true
          disk-cache: release-2.0.4-beta
          repository-cache: true

      - name: Build, test and validate unsigned MSI
        shell: pwsh
        run: ./scripts/build-release.ps1 -ReleaseLabel '2.0.4-beta' -ProductVersion '2.0.4.0'

      - name: Upload unsigned release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yamatana-ai-ime-2.0.4-beta-unsigned
          path: |
            release/Yamatana-AI-IME-MOZC-Ver-2.0.4-beta-x64.msi
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
