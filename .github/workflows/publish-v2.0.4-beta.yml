name: Publish v2.0.4-beta

on:
  workflow_run:
    workflows: ['Build v2.0.4-beta MSI']
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact build source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download exact v2.0.4-beta build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p release
          gh run download "$BUILD_RUN_ID" \
            --repo YAMA-TANA/yamatana-ai-ime \
            --name yamatana-ai-ime-2.0.4-beta-unsigned \
            --dir release

      - name: Verify MSI checksum
        working-directory: release
        run: sha256sum -c SHA256SUMS.txt

      - name: Prepare release notes
        run: |
          cp RELEASE_NOTES_v2.0.4-beta.md release-notes.md
          MSI_SHA256="$(awk 'NR==1 {print toupper($1)}' release/SHA256SUMS.txt)"
          printf '\n## SHA-256\n\n`%s`\n' "$MSI_SHA256" >> release-notes.md

      - name: Publish v2.0.4-beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view v2.0.4-beta --repo YAMA-TANA/yamatana-ai-ime >/dev/null 2>&1; then
            gh release edit v2.0.4-beta \
              --repo YAMA-TANA/yamatana-ai-ime \
              --target "$TARGET_SHA" \
              --title 'Yamatana AI IME v2.0.4-beta' \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create v2.0.4-beta \
              --repo YAMA-TANA/yamatana-ai-ime \
              --target "$TARGET_SHA" \
              --title 'Yamatana AI IME v2.0.4-beta' \
              --notes-file release-notes.md \
              --prerelease
          fi

          gh release upload v2.0.4-beta \
            release/Yamatana-AI-IME-MOZC-Ver-2.0.4-beta-x64.msi \
            release/SHA256SUMS.txt \
            --repo YAMA-TANA/yamatana-ai-ime \
            --clobber
