name: Release v2.0.1-beta

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v2.0.1-beta.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@77a1d3d18379c7cb0a7e3b9fcaaa4d94f1029763 # 0.18.0
        with:
          bazelisk-cache: true
          disk-cache: release-v2.0.1-beta
          repository-cache: true
      - name: Build, test and validate unsigned MSI
        shell: pwsh
        run: ./scripts/build-release.ps1 -ReleaseLabel '2.0.1-beta' -ProductVersion '2.0.1.0'
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yamatana-ai-ime-2.0.1-beta-unsigned
          path: |
            release/Yamatana-AI-IME-MOZC-Ver-2.0.1-beta-x64.msi
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v2.0.1-beta
          target_commitish: main
          name: Yamatana AI IME v2.0.1-beta
          prerelease: true
          body: |
            # Yamatana AI IME v2.0.1-beta

            v2.0.0-beta の実機フィードバックを反映した、安全性重視の修正版です。70Mモデル自体は v2.0.0-beta と同じです。

            ## 主な変更

            - Mozcの1位候補をAIが上書きする際にconfidence gateを追加しました。短く曖昧な文脈ではMozc順位を強く保護し、下位候補を1位へ上げるほど大きなスコア差を要求します。
            - `この` + `にもつ` のように弱い文脈で `荷物` を `に持つ` へ壊すタイプの誤爆を抑える設計へ変更しました。
            - segmentのsplit / mergeを先に確定する方式をやめ、Mozc辞書から境界repair候補を組み立て、現在のMozc文字列とAIで比較してから境界を変更します。
            - `主戦 / 率` → `主旋律` のようなmerge、`飛行少年` → `非行 / 少年` のようなsplitは、repair候補が明確に優勢な場合だけ実行します。
            - ranker失敗、timeout、候補不足、僅差の場合はsegment境界を変更せずMozcの状態を維持します。
            - `私が / する / こと` のような普通の文法的segmentを誤って結合しにくくしました。
            - Mozc C++ rewriter専用CIを追加し、`ai_rewriter_test` をWindows/Bazelで実ビルド・実行するようにしました。

            ## 注意

            **Unsigned Beta:** このMSIはまだコード署名されていません。インストール前に添付の `SHA256SUMS.txt` でハッシュを確認してください。
          files: |
            release/Yamatana-AI-IME-MOZC-Ver-2.0.1-beta-x64.msi
            release/SHA256SUMS.txt
