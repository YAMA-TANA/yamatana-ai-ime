name: Mozc rewriter CI

on:
  pull_request:
    paths:
      - 'mozc/overlay/src/rewriter/**'
      - 'scripts/modernize_mozc_ui.py'
      - 'scripts/prepare_mozc_source.ps1'
      - '.github/workflows/mozc-rewriter-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mozc-rewriter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rewriter-test:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@77a1d3d18379c7cb0a7e3b9fcaaa4d94f1029763 # 0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Prepare pinned Mozc source
        shell: pwsh
        run: ./scripts/prepare_mozc_source.ps1
      - name: Build and run AI rewriter tests
        shell: pwsh
        run: |
          Push-Location build/mozc-src/src
          try {
            bazelisk test //rewriter:ai_rewriter_test --config=release_build --platforms=//:windows-x86_64
            if ($LASTEXITCODE -ne 0) { throw 'Mozc AI rewriter test failed' }
          } finally {
            Pop-Location
          }
