name: Publish v2.0.2-beta

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v2.0.2-beta.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download completed v2.0.2-beta build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh run download 34106203314 \
            --repo YAMA-TANA/yamatana-ai-ime \
            --name yamatana-ai-ime-2.0.2-beta-modern-ui-unsigned \
            --dir release

      - name: Verify MSI checksum
        working-directory: release
        run: sha256sum -c SHA256SUMS.txt

      - name: Publish or refresh GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          # Yamatana AI IME v2.0.2-beta

          Mozc由来の候補ウィンドウをWindows 11向けに刷新し、AI再ランキングもAIスコア差を中心に判断するよう調整したBetaです。

          ## 主な変更

          - 候補ウィンドウ全体を角丸化し、Windows 11に馴染む見た目へ調整しました。
          - 選択中の候補を、全面塗りつぶしではなく角丸の選択カードとして表示します。
          - 余白、文字サイズ、補助説明、スクロールバー、フッターの色と密度を見直しました。
          - Mozc由来の候補ウィンドウ内ロゴ表示を外し、よりシンプルな見た目にしました。
          - AIによって1位へ再ランキングされた候補には、小さな `AI` 表示を付けるためのUIを追加しました。
          - DPIスケーリングを考慮し、高DPI環境でも角丸や余白が極端に崩れにくいようにしています。
          - Mozc取得後にUI差分を自動適用するビルド工程を追加し、GitHub Actionsから同じ構成を再現できるようにしました。

          ## AI再ランキングの調整

          - Mozcの元順位に一律の線形ペナルティを加える方式をやめ、実際のAIスコア差を中心に候補順位を判断するよう変更しました。
          - 下位候補でもAIが明確に高いスコアを出した場合は1位へ昇格でき、元順位だけで実質的に逆転不能になる挙動を抑えました。
          - 曖昧な場合の安全側判定は、候補が元々何位だったかではなく、AIトップとMozcトップのスコア差と文脈量を基準にします。
          - compound segment repairの安全策は維持しつつ、通常変換ではAI rerankerの判断をより直接反映します。

          ## GPU・プライバシー

          DirectML対応環境ではGPU推論を優先し、利用できない場合はCPUへフォールバックします。AI推論はローカルで完結し、入力内容や文脈を外部AIサービスへ送信しません。

          ## 注意

          **Unsigned Beta:** このMSIはまだコード署名されていません。Windowsの警告が表示される場合があります。インストール前に同梱の `SHA256SUMS.txt` でハッシュを確認してください。

          MSI SHA-256:

          `85CE12379793E346C5896B4511319F816F1E784AE1D2344903BA10B4F19D5037`
          EOF

          if gh release view v2.0.2-beta --repo YAMA-TANA/yamatana-ai-ime >/dev/null 2>&1; then
            gh release edit v2.0.2-beta \
              --repo YAMA-TANA/yamatana-ai-ime \
              --target d4126ffac19ce3cc3490c5adc7b8dcf67247353d \
              --title 'Yamatana AI IME v2.0.2-beta' \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create v2.0.2-beta \
              --repo YAMA-TANA/yamatana-ai-ime \
              --target d4126ffac19ce3cc3490c5adc7b8dcf67247353d \
              --title 'Yamatana AI IME v2.0.2-beta' \
              --notes-file release-notes.md \
              --prerelease
          fi

          gh release upload v2.0.2-beta \
            release/Yamatana-AI-IME-MOZC-Ver-2.0.2-beta-x64.msi \
            release/SHA256SUMS.txt \
            --repo YAMA-TANA/yamatana-ai-ime \
            --clobber
