  async function renderPageList(){if(!pdf)return;const list=$('#pageList');list.innerHTML='';for(const n of pageOrder){const item=document.createElement('div');item.className='page-item'+(n===currentPage?' active':'');item.dataset.page=n;const c=document.createElement('canvas');const p=await pdf.getPage(n),v=p.getViewport({scale:.22,rotation:rotations[n]||0});c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;const label=document.createElement('div');label.className='page-label';label.innerHTML='<span>'+t('page')+' '+n+'</span><span>'+(annotations[n]?.length||0)+'</span>';item.append(c,label);item.addEventListener('click',()=>{currentPage=n;renderPages()});list.append(item)}}
  function point(e){const r=$('#overlay').getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
  function renderOverlay(){const o=$('#overlay');o.innerHTML='';const list=annotations[currentPage]||[];for(const a of list){if(a.kind==='pen'){let svg=o.querySelector('svg');if(!svg){svg=document.createElementNS('http://www.w3.org/2000/svg','svg');o.append(svg)}const p=document.createElementNS('http://www.w3.org/2000/svg','polyline');p.setAttribute('points',a.points.map(x=>`${x.x*100}%,${x.y*100}%`).join(' '));p.style.stroke=ink();p.style.strokeWidth=Math.max(1,a.width*100)+'px';svg.append(p);continue}const d=document.createElement('div');d.className='overlay-item overlay-'+a.kind;d.style.left=a.x*100+'%';d.style.top=a.y*100+'%';d.style.width=a.w*100+'%';d.style.height=a.h*100+'%';if(a.kind==='text'){d.textContent=a.text;d.style.fontSize=(a.size*100)+'%';d.style.color=ink();}else if(a.kind==='highlight'){d.style.background=ink();d.style.opacity=Number(a.opacity)/100*.7}else if(a.kind==='whiteout'){d.style.opacity=Number(a.opacity)/100}o.append(d)}}
  function ink(){return $('#inkColor').value}
  function addAnn(a){(annotations[currentPage]??=[]).push(a);renderOverlay();renderPageList();updateAnnotationList()}
  function updateAnnotationList(){const list=$('#annotationList'),items=annotations[currentPage]||[];$('#annotationCount').textContent=items.length;list.innerHTML=items.map((a,i)=>`<div class="annotation-row"><span>${a.kind==='text'?a.text:a.kind}</span><button data-i="${i}" aria-label="delete">×</button></div>`).join('');list.querySelectorAll('button').forEach(b=>b.onclick=()=>{items.splice(Number(b.dataset.i),1);renderOverlay();renderPageList();updateAnnotationList()})}
  function onPointerDown(e){if(!pdf||tool==='select')return;const p=point(e);if(tool==='text'){const text=$('#textValue').value.trim();if(!text){toast(t('textNeeded'));return}addAnn({kind:'text',x:p.x,y:p.y,w:.36,h:.08,text,size:Number($('#fontSize').value)/100, color:ink()});return}drawing={start:p,points:[p]};$('#overlay').setPointerCapture?.(e.pointerId)}
  function onPointerMove(e){if(!drawing)return;const p=point(e);drawing.points.push(p);if(tool==='pen'){renderOverlay();const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');const line=document.createElementNS('http://www.w3.org/2000/svg','polyline');line.setAttribute('points',drawing.points.map(x=>`${x.x*100}%,${x.y*100}%`).join(' '));line.style.stroke=ink();line.style.strokeWidth='3px';svg.append(line);$('#overlay').append(svg)}}
  function onPointerUp(){if(!drawing)return;const s=drawing.start,p=drawing.points[drawing.points.length-1]||s;const x=Math.min(s.x,p.x),y=Math.min(s.y,p.y),w=Math.max(.008,Math.abs(s.x-p.x)),h=Math.max(.008,Math.abs(s.y-p.y));if(tool==='pen')addAnn({kind:'pen',points:drawing.points,width:Number($('#lineWidth').value)/1000});else addAnn({kind:tool,x,y,w,h,opacity:Number($('#opacity').value),color:ink()});drawing=null;renderOverlay()}
  function setTool(next){tool=next;document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.tool===next));$('#overlay').style.cursor=next==='select'?'default':next==='text'?'text':'crosshair'}
  function movePage(dir){const i=pageOrder.indexOf(currentPage),j=i+dir;if(i<0||j<0||j>=pageOrder.length)return;[pageOrder[i],pageOrder[j]]=[pageOrder[j],pageOrder[i]];renderPageList();toast(t('moved'))}
  function deletePage(){const i=pageOrder.indexOf(currentPage);if(i<0)return;const n=pageOrder[i];if(pageOrder.length===1){toast(t('needPdf'));return}pageOrder.splice(i,1);currentPage=pageOrder[Math.min(i,pageOrder.length-1)];renderPages();toast(t('removed'))}
  async function exportPdf(){if(!pdfBytes){toast(t('needPdf'));return}toast(t('loading'));try{const src=await PDFLib.PDFDocument.load(pdfBytes),out=await PDFLib.PDFDocument.create(),copies=await out.copyPages(src,pageOrder);copies.forEach(p=>out.addPage(p));for(let i=0;i<pageOrder.length;i++){const orig=pageOrder[i],page=out.getPage(i),{width,height}=page.getSize();page.setRotation(PDFLib.degrees(rotations[orig]||0));for(const a of annotations[orig]||[]){if(a.kind==='text')page.drawText(a.text,{x:a.x*width,y:height-(a.y+a.h)*height+3,size:Number($('#fontSize').value),color:color(a.color||ink()),opacity:1,maxWidth:a.w*width});else if(a.kind==='highlight'||a.kind==='whiteout')page.drawRectangle({x:a.x*width,y:height-(a.y+a.h)*height,width:a.w*width,height:a.h*height,color:a.kind==='whiteout'?PDFLib.rgb(1,1,1):color(a.color||ink()),opacity:a.kind==='whiteout'?1:Number(a.opacity||35)/100,borderWidth:0});else if(a.kind==='pen')for(let j=1;j<a.points.length;j++){const p1=a.points[j-1],p2=a.points[j];page.drawLine({start:{x:p1.x*width,y:height-p1.y*height},end:{x:p2.x*width,y:height-p2.y*height},thickness:Math.max(1,a.width*width),color:color(a.color||ink())})}}}const bytes=await out.save(),blob=new Blob([bytes],{type:'application/pdf'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='edited-'+(($('#fileMeta').textContent.split(' · ')[0]||'document.pdf').replace(/\.pdf$/i,''))+'.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast(t('saved'));report('export_pdf')}catch(e){console.error(e);toast(t('invalid'))}}
  function color(hex){const n=parseInt(hex.replace('#',''),16);return PDFLib.rgb((n>>16&255)/255,(n>>8&255)/255,(n&255)/255)}
  function fit(){const r=$('#stage').getBoundingClientRect();scale=Math.max(.5,Math.min(2.5,(r.width-70)/($('#pdfCanvas').width/scale)));renderPages()}
  async function report(eventName){try{await fetch('https://form-lens-api.hurukigeoetym.workers.dev/api/events',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({site:'pdf-workbench',eventName,path:location.pathname,language:lang})})}catch{}}
  $('#languageSelect').value=lang;$('#languageSelect').onchange=e=>{lang=e.target.value;localStorage.setItem('pdf-workbench-language',lang);applyLanguage()};$('#fileInput').onchange=e=>openFile(e.target.files[0]);$('#dropzone').ondragover=e=>{e.preventDefault();$('#dropzone').style.borderColor='var(--accent)'};$('#dropzone').ondragleave=()=>$('#dropzone').style.borderColor='';$('#dropzone').ondrop=e=>{e.preventDefault();$('#dropzone').style.borderColor='';openFile(e.dataTransfer.files[0])};$('#overlay').addEventListener('pointerdown',onPointerDown);$('#overlay').addEventListener('pointermove',onPointerMove);$('#overlay').addEventListener('pointerup',onPointerUp);document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));$('#addText').onclick=()=>setTool('text');$('#fontSize').oninput=e=>$('#fontSizeOutput').textContent=e.target.value+' px';$('#lineWidth').oninput=e=>$('#lineWidthOutput').textContent=e.target.value+' px';$('#opacity').oninput=e=>$('#opacityOutput').textContent=e.target.value+'%';$('#prevPage').onclick=()=>{const i=pageOrder.indexOf(currentPage);if(i>0){currentPage=pageOrder[i-1];renderPages()}};$('#nextPage').onclick=()=>{const i=pageOrder.indexOf(currentPage);if(i<pageOrder.length-1){currentPage=pageOrder[i+1];renderPages()}};$('#pageNumber').onchange=e=>{const n=pageOrder[Math.max(0,Math.min(pageOrder.length-1,Number(e.target.value)-1))];if(n){currentPage=n;renderPages()}};$('#zoomIn').onclick=()=>{scale=Math.min(3,scale+.15);renderPages()};$('#zoomOut').onclick=()=>{scale=Math.max(.55,scale-.15);renderPages()};$('#fitPage').onclick=fit;$('#moveUp').onclick=()=>movePage(-1);$('#moveDown').onclick=()=>movePage(1);$('#deletePage').onclick=deletePage;$('#exportTop').onclick=exportPdf;applyLanguage();setEnabled(false);report('page_view');
  </script>
</body><script>
(()=>{const del=document.querySelector('#deletePage');if(!del)return;const b=document.createElement('button');b.className='button';b.id='rotatePage';b.type='button';b.disabled=true;b.setAttribute('aria-label','Rotate page');b.textContent='↻';del.parentElement.insertBefore(b,del);b.onclick=()=>{rotations[currentPage]=((rotations[currentPage]||0)+90)%360;renderPages();toast(t('moved'))};const observer=new MutationObserver(()=>{b.disabled=del.disabled});observer.observe(del,{attributes:true,attributeFilter:['disabled']})})();
